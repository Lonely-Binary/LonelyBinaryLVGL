name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This library compiles against Lonely Binary Display, which lives in
      # its own repository. The default GITHUB_TOKEN is scoped to the
      # repository the workflow runs in, so while that sibling repo is private
      # a plain checkout comes back "Not Found".
      #
      # LB_DISPLAY_DEPLOY_KEY is the private half of a READ-ONLY deploy key
      # registered on Lonely-Binary/LonelyBinaryDisplay. A deploy key is
      # narrower than a PAT: one repository, read only, tied to no user
      # account, and it does not expire. Revoke it at
      # LonelyBinaryDisplay -> Settings -> Deploy keys.
      #
      # Once both repositories are public (Arduino Library Manager only indexes
      # public ones, so that day is coming) this whole mechanism can go and a
      # bare actions/checkout will work.
      - name: Check out Lonely Binary Display alongside
        id: dep
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Lonely-Binary/LonelyBinaryDisplay
          ssh-key: ${{ secrets.LB_DISPLAY_DEPLOY_KEY }}
          path: .deps/LonelyBinaryDisplay

      # Lonely Binary Display draws through Lonely Binary GFX, which is public
      # but not in the Library Manager index yet, so fetch it the same way.
      - uses: actions/checkout@v4
        with:
          repository: Lonely-Binary/LonelyBinaryGFX
          path: .deps/LonelyBinaryGFX

      - name: Explain a failed dependency checkout
        if: steps.dep.outcome != 'success'
        run: |
          echo "::error::Could not check out Lonely-Binary/LonelyBinaryDisplay."
          echo ""
          echo "This job needs to read a private sibling repository, which the"
          echo "default GITHUB_TOKEN cannot do. Check, in order:"
          echo ""
          echo "  1. Secret LB_DISPLAY_DEPLOY_KEY exists on THIS repository and"
          echo "     holds the PRIVATE half of the deploy key (the whole file,"
          echo "     including the BEGIN/END lines)."
          echo "  2. The matching PUBLIC half is registered under"
          echo "     LonelyBinaryDisplay -> Settings -> Deploy keys."
          echo ""
          echo "Or make both repositories public, which removes the need for"
          echo "any of this and is required for Library Manager anyway."
          exit 1

      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      # The whole point of vendoring LVGL is that no lv_conf.h is copied
      # anywhere. A CI runner is a clean machine, so if this builds here it
      # builds on a customer's fresh install too.
      - name: No stray lv_conf.h on the machine
        run: |
          if find ~/Arduino/libraries -maxdepth 1 -name lv_conf.h | grep -q .; then
            echo "A stray lv_conf.h would invalidate this test"; exit 1
          fi

      - name: Build examples on both MCUs
        run: |
          set -e
          for fqbn in esp32:esp32:esp32s3 esp32:esp32:esp32; do
            for ex in examples/*/; do
              echo "== $fqbn $ex"
              arduino-cli compile --fqbn "$fqbn" \
                --library . --library .deps/LonelyBinaryDisplay --library .deps/LonelyBinaryGFX "$ex"
            done
          done

      # Tutorial code says `#include <lvgl.h>`. src/lvgl.h is a shim so that
      # line resolves to our vendored copy instead of failing, or worse,
      # dragging in a second LVGL from Library Manager.
      - name: Tutorial-style "#include <lvgl.h>" resolves to the vendored copy
        run: |
          mkdir -p /tmp/ShimCheck
          cat > /tmp/ShimCheck/ShimCheck.ino <<'EOF'
          #include <LonelyBinaryDisplay.h>
          #include <LonelyBinaryLVGL.h>
          #include <lvgl.h>
          LB_Display display(LB_TFT_24);
          void setup() {
            display.begin();
            LB_LVGL.begin(display);
            lv_obj_center(lv_label_create(lv_screen_active()));
          }
          void loop() { LB_LVGL.loop(); }
          EOF
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --library . --library .deps/LonelyBinaryDisplay --library .deps/LonelyBinaryGFX /tmp/ShimCheck

      # Nothing under src/lvgl is ours to edit — it is regenerated wholesale by
      # tools/vendor_lvgl.sh. This catches a hand-patch that would be silently
      # lost on the next LVGL bump.
      - name: Vendored LVGL matches the pinned release
        run: |
          PINNED=$(cat src/lvgl/VENDORED_VERSION)
          ./tools/vendor_lvgl.sh "$PINNED"
          if ! git diff --quiet -- src/lvgl; then
            echo "src/lvgl differs from a clean vendoring of $PINNED:"
            git diff --stat -- src/lvgl
            exit 1
          fi
          echo "src/lvgl is a clean $PINNED"
