name=Lonely Binary LVGL
version=0.1.0
author=Lonely Binary <hello@lonelybinary.com>
maintainer=Lonely Binary <hello@lonelybinary.com>
sentence=LVGL on a Lonely Binary display, with no lv_conf.h to copy and nothing to configure.
paragraph=Wires LVGL to the panel you selected with the Lonely Binary Display library: flush callback, draw buffers, tick source and refresh loop, in one call. A known-good lv_conf.h ships inside the library and LVGL finds it on the include path, so there is no template to copy into your libraries folder and rename. On boards with PSRAM, LVGL renders straight into the panel framebuffer with no copy at all. Includes LB_Style, a flat high-contrast style sheet built for small panels read at a distance. LVGL itself is vendored, MIT-licensed and unmodified apart from removing desktop back-ends. Brought to you by Lonely Binary — thank you for supporting our open-source work!
category=Display
url=https://github.com/Lonely-Binary/LonelyBinaryLVGL
architectures=esp32
depends=Lonely Binary Display,Lonely Binary GFX
includes=LonelyBinaryLVGL.h
license=MIT
